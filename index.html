<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Photo Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 24px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    #image {
      width: 576px;
      max-width: 100%;
      height: 360px;
      margin: 0 auto 24px auto;
      padding: 16px;
      border: 3px solid #ffffff;
      border-radius: 8px;
      background-color: #1f1f1f;
      background-image: url("");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      line-height: 1.5;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 900px;
      margin: 0 auto;
    }

    figure.photo-card {
      width: 135px;
      height: 100px;
      margin: 0;
      border: 2px solid #999999;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }

    figure.photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    figure.photo-card img:focus {
      outline: 3px solid #ffd000;
      outline-offset: -3px;
    }
  </style>
</head>
<body onload="addTabFocus()">
  <h1>Interactive Photo Gallery</h1>

  <div id="image">Hover over or focus on a photo below to preview it here.</div>

  <div class="gallery">
    <figure class="photo-card">
      <img
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80"
        alt="Calm mountain lake reflecting pine trees at sunset"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      >
    </figure>

    <figure class="photo-card">
      <img
        src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80"
        alt="Misty green hills and forest valley at dawn"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      >
    </figure>

    <figure class="photo-card">
      <img
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
        alt="Sandy tropical beach with gentle ocean waves"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      >
    </figure>

    <figure class="photo-card">
      <img
        src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"
        alt="Sunlight shining over rugged mountain peaks and valley"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      >
    </figure>

    <figure class="photo-card">
      <img
        src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=800&q=80"
        alt="Deep blue ocean water with small ripples"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      >
    </figure>

    <figure class="photo-card">
      <img
        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
        alt="Tall forest trees with sunbeams filtering through leaves"
        onmouseover="upDate(this)"
        onmouseleave="unDo()"
        onfocus="upDate(this)"
        onblur="unDo()"
      >
    </figure>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
